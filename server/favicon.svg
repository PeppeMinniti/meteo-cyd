<?xml version="1.0" encoding="UTF-8"?>
<!--
  favicon.svg - Icona della scheda browser per la dashboard /meteo/.
  Meteo "completo": sole, nuvola, pioggia e fulmine. Formato SVG (vettoriale):
  resta nitido a qualsiasi dimensione. Sfondo scuro arrotondato coordinato col
  tema della pagina.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sfondo arrotondato (tinta scura del tema) -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0f1419"/>

  <!-- SOLE (giallo) in alto a sinistra, con i raggi -->
  <g stroke="#ffd54f" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="6"  x2="20" y2="12"/>
    <line x1="8"  y1="20" x2="14" y2="20"/>
    <line x1="10" y1="10" x2="14" y2="14"/>
    <line x1="30" y1="10" x2="26" y2="14"/>
    <line x1="10" y1="30" x2="14" y2="26"/>
  </g>
  <circle cx="20" cy="20" r="7" fill="#ffd54f"/>

  <!-- NUVOLA (bianco/grigio chiaro) al centro -->
  <g fill="#eef2f7">
    <circle cx="28" cy="30" r="9"/>
    <circle cx="40" cy="27" r="11"/>
    <circle cx="49" cy="32" r="8"/>
    <rect x="26" y="32" width="26" height="10" rx="5"/>
  </g>

  <!-- PIOGGIA (azzurro): gocce/linee sotto la nuvola -->
  <g stroke="#4fc3f7" stroke-width="3.5" stroke-linecap="round">
    <line x1="30" y1="46" x2="27" y2="54"/>
    <line x1="48" y1="46" x2="45" y2="54"/>
  </g>

  <!-- FULMINE (giallo) al centro, tra le gocce -->
  <polygon points="40,42 32,54 38,54 35,62 47,49 40,49" fill="#ffd54f"
           stroke="#0f1419" stroke-width="1" stroke-linejoin="round"/>
</svg>
